<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Album Art Overlay{% endblock %} · StreamerSonglist Album Art Overlay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎨 Album Art Overlay</div>
    <nav>
      <a href="{{ url_for('songs_page') }}" class="{{ 'active' if active=='songs' }}">Songs</a>
      <a href="{{ url_for('review_page') }}" class="{{ 'active' if active=='review' }}">Review</a>
      <a href="{{ url_for('queue_page') }}" class="{{ 'active' if active=='queue' }}">Queue</a>
      <a href="{{ url_for('overlay_settings_page') }}" class="{{ 'active' if active=='overlay' }}">Overlay</a>
      <a href="{{ url_for('settings_page') }}" class="{{ 'active' if active=='settings' }}">Settings</a>
    </nav>
    <div id="runtime-status" class="runtime-status" title=""></div>
  </header>
  <script>
  async function pollRuntimeStatus() {
    const el = document.getElementById('runtime-status');
    try {
      const d = await (await fetch('/api/runtime/status')).json();
      if (d.running) {
        const song = d.current_title
          ? `▶ ${d.current_title}${d.current_artist ? ' — ' + d.current_artist : ''}`
          : 'queue empty';
        const live = d.events && d.events.connected && d.events.subscribed;
        el.innerHTML = `<span class="dot on"></span> Live service: ${song} · ${d.queue_length} queued`
          + (live ? ` · <span class="bolt" title="Instant updates connected">⚡</span>` : '');
        el.title = live
          ? 'Writing the artwork image and serving the overlays — instant updates connected'
          : 'Writing the artwork image and serving the overlays — polling';
      } else {
        el.innerHTML = `<span class="dot off"></span> Live service off`;
        el.title = d.error || 'Enable in Settings (song source + runtime service)';
      }
    } catch (e) { /* leave as-is */ }
    setTimeout(pollRuntimeStatus, 5000);
  }
  pollRuntimeStatus();
  </script>
  <main>
    <!-- Update banner. Lives in base.html so every dashboard page shows it —
         and note the overlay pages do NOT extend this template, so it can never
         appear in an OBS browser source. -->
    <div id="update-banner" class="update-banner" hidden>
      <span class="update-arrow">⬆</span>
      <div class="update-body">
        <strong><span id="update-latest"></span> available</strong><span id="update-name"></span>
        <div class="small">
          You're on v{{ app_version }} ·
          <a id="update-link" href="#" target="_blank" rel="noopener">What's new ↗</a>
        </div>
      </div>
      <button type="button" id="update-dismiss" title="Dismiss until the next release">✕</button>
    </div>
    <script>
    (async function updateBanner(retry = true) {
      let d;
      try { d = await (await fetch('{{ url_for("api_update") }}')).json(); }
      catch (e) { return; }  // offline or firewalled — say nothing
      if (!d.checked && retry) {
        // The launch-time check may still be in flight; the browser opens about a
        // second after startup. One more look, then leave it for the next page load.
        return setTimeout(() => updateBanner(false), 4000);
      }
      if (!d.update_available) return;
      document.getElementById('update-latest').textContent = d.latest;
      document.getElementById('update-name').textContent = d.name ? ` — ${d.name}` : '';
      document.getElementById('update-link').href = d.url;
      const banner = document.getElementById('update-banner');
      banner.hidden = false;
      document.getElementById('update-dismiss').addEventListener('click', async () => {
        banner.hidden = true;
        await fetch('{{ url_for("api_update_skip") }}', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({version: d.latest})
        });
      });
    })();
    </script>
    {% block content %}{% endblock %}
  </main>
  <script>
  // Native file dialog for any [data-target] path field. Lives here rather
  // than on one page because both Settings and Overlay have path fields —
  // and after <main>, so the buttons exist by the time this runs.
  document.querySelectorAll('.browse-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const input = document.querySelector(`[name=${btn.dataset.target}]`);
      btn.disabled = true;
      try {
        const r = await fetch('{{ url_for("api_browse") }}', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            kind: btn.dataset.kind,
            initialfile: btn.dataset.initialfile || '',
            filetypes: btn.dataset.filetypes || ''
          })
        });
        const d = await r.json();
        if (d.ok && d.path) input.value = d.path.replace(/\//g, '\\');
      } catch (e) { /* dialog cancelled or failed — leave the field as is */ }
      btn.disabled = false;
    });
  });
  </script>
  <footer class="kofi-footer">
    <span>Enjoying Album Art Overlay? Fuel the next update —</span>
    <a class="kofi-button" href="https://ko-fi.com/alanthompson_music" target="_blank" rel="noopener">
      <svg class="kofi-cup" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M4 4h13a4 4 0 0 1 0 8h-1.1A6.5 6.5 0 0 1 9.5 17h-1A6.5 6.5 0 0 1 2 10.5V6a2 2 0 0 1 2-2zm12 2v4h1a2 2 0 1 0 0-4h-1z"/>
        <path fill="#FF5E5B" d="M9 7.2c-.9 0-1.6.7-1.6 1.6 0 1.5 2.6 3.2 2.6 3.2s2.6-1.7 2.6-3.2c0-.9-.7-1.6-1.6-1.6-.4 0-.8.2-1 .5-.2-.3-.6-.5-1-.5z"/>
        <path fill="#fff" d="M3 19h13v2H3z"/>
      </svg>
      Buy me a coffee
    </a>
  </footer>
</body>
</html>

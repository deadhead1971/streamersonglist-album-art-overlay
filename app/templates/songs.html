{% extends "base.html" %}
{% set active = 'songs' %}
{% block title %}Songs{% endblock %}
{% block content %}
<div class="panel">
  <div class="row spread">
    <h1 class="with-avatar">
      <img id="channel-avatar" class="avatar" hidden alt="">
      {% if cfg.streamersonglist_username %}{{ cfg.streamersonglist_username }}'s {% endif %}Songlist</h1>
    <div class="row">
      <button id="sync-btn" class="secondary">Sync songlist</button>
      <button id="propose-btn" class="primary">Find artwork</button>
      <button id="stop-btn" class="secondary" hidden>Stop</button>
    </div>
  </div>
  <div id="status" class="muted"></div>
  <div id="progress" class="progress" hidden><div id="bar"></div></div>

  <div class="row filters">
    <input type="search" id="search" placeholder="Filter…">
    <label class="checkbox"><input type="checkbox" id="only-missing"> Only songs needing art</label>
    <span id="counts" class="muted"></span>
  </div>

  <table class="songs">
    <thead><tr>
      <th>Art</th>
      <th><button type="button" class="th-sort" data-col="title">Title</button></th>
      <th><button type="button" class="th-sort" data-col="artist">Artist</button></th>
      <th>Status</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const statusEl = document.getElementById('status');
const rowsEl = document.getElementById('rows');
let allRows = [];

// What the list looks like when a review sends the user back here.
const ARRIVAL = new URLSearchParams(location.search);
const SAVED_KEY = ARRIVAL.get('saved');
const FINISHED = ARRIVAL.get('finished');
const RETURNING = SAVED_KEY !== null || ARRIVAL.has('back');
const VIEW_STORE = 'songs.view';
const SORT_STORE = 'songs.sort';

// A per-viewer convenience: with storage blocked the list still works, it just
// forgets. Artist A-Z is the order the server sends.
let sortBy = {col: 'artist', dir: 1};
try {
  const saved = JSON.parse(localStorage.getItem(SORT_STORE));
  if (saved && ['artist', 'title'].includes(saved.col) && [1, -1].includes(saved.dir)) {
    sortBy = saved;
  }
} catch (e) { /* keep the default */ }

// Channel avatar, if the live service has resolved one (v2 API only). Fetched
// from the status endpoint rather than rendered server-side so the page never
// waits on a network call; a dead CDN URL degrades to the text-only heading.
(async () => {
  try {
    const d = await (await fetch('/api/runtime/status')).json();
    if (!d.avatar) return;
    const img = document.getElementById('channel-avatar');
    img.onerror = () => { img.hidden = true; };
    img.src = d.avatar;
    img.hidden = false;
  } catch (e) { /* no avatar — leave the heading as text */ }
})();

const STATUS_LABEL = {
  confirmed: '✅ confirmed', proposed: '🟡 proposed',
  unverified: '🔵 unverified', rejected_all: '⛔ no art', null: '— none'
};

function needsArt(r) {
  return !(r.status === 'confirmed');
}

const titleOrder = new Intl.Collator(undefined, {sensitivity: 'base'});

function sortedRows() {
  if (sortBy.col === 'artist') {
    return sortBy.dir > 0 ? allRows : [...allRows].reverse();
  }
  // Trimmed because SSL sends stray spaces, and a leading one would otherwise
  // pull a title to the top of the list while looking perfectly normal.
  const rows = [...allRows].sort((a, b) =>
    titleOrder.compare((a.title || '').trim(), (b.title || '').trim())
    || titleOrder.compare((a.artist || '').trim(), (b.artist || '').trim()));
  return sortBy.dir > 0 ? rows : rows.reverse();
}

function paintSort() {
  document.querySelectorAll('.th-sort').forEach(btn => {
    const on = btn.dataset.col === sortBy.col;
    const label = btn.dataset.col === 'title' ? 'Title' : 'Artist';
    btn.textContent = label + (on ? (sortBy.dir > 0 ? ' ▲' : ' ▼') : '');
    btn.classList.toggle('on', on);
    btn.parentElement.setAttribute('aria-sort',
      on ? (sortBy.dir > 0 ? 'ascending' : 'descending') : 'none');
  });
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const onlyMissing = document.getElementById('only-missing').checked;
  const filtered = sortedRows().filter(r => {
    if (onlyMissing && !needsArt(r)) return false;
    if (q && !(`${r.title} ${r.artist}`.toLowerCase().includes(q))) return false;
    return true;
  });
  rowsEl.innerHTML = '';
  for (const r of filtered) {
    const tr = document.createElement('tr');
    tr.dataset.key = r.key;
    // The small cached copy, not the full image, and only once a row nears the
    // screen: the first visit then generates only the thumbnails it shows.
    const thumb = r.thumb_url
      ? `<img class="thumb" src="${r.thumb_url}" alt="" loading="lazy">`
      : `<div class="thumb empty"></div>`;
    const reviewUrl = '{{ url_for("review_page") }}?key=' + encodeURIComponent(r.key);
    tr.innerHTML = `<td>${thumb}</td><td>${esc(r.title)}</td><td>${esc(r.artist)}</td>
      <td>${STATUS_LABEL[r.status] || STATUS_LABEL.null}</td>
      <td><a class="review-link" href="${reviewUrl}">Review ▸</a></td>`;
    rowsEl.appendChild(tr);
  }
  document.getElementById('counts').textContent =
    `${filtered.length} shown · ${allRows.length} in list · ` +
    `${allRows.filter(needsArt).length} need art`;
}

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function loadRows() {
  const r = await fetch('{{ url_for("api_entries") }}?filter=songlist');
  const d = await r.json();
  // An unreadable library must not look like a songlist with nothing in it.
  if (!r.ok) statusEl.textContent = d.error || 'Could not load your songs.';
  allRows = d.entries || [];
  render();
}

function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.hidden = false;
  setTimeout(() => { el.hidden = true; }, 5000);
}

// Remember the filter and scroll position as the user leaves for a review, so
// a return doesn't drop them at the top of the whole list.
rowsEl.addEventListener('click', e => {
  if (!e.target.closest('.review-link')) return;
  try {
    sessionStorage.setItem(VIEW_STORE, JSON.stringify({
      q: document.getElementById('search').value,
      onlyMissing: document.getElementById('only-missing').checked,
      y: window.scrollY,
    }));
  } catch (err) { /* it just won't come back to the same place */ }
});

function takeSavedView() {
  try {
    const view = JSON.parse(sessionStorage.getItem(VIEW_STORE));
    sessionStorage.removeItem(VIEW_STORE);
    return view;
  } catch (e) { return null; }
}

// Runs once the rows exist. The confirmed song can be missing from them - it
// drops out of "Only songs needing art" - so the message has to stand alone.
function announceArrival(view) {
  if (view) window.scrollTo(0, view.y || 0);
  if (SAVED_KEY !== null) {
    const song = allRows.find(r => r.key === SAVED_KEY);
    showToast(song ? `Saved: ${song.title}` : 'Saved.');
    const row = [...rowsEl.children].find(tr => tr.dataset.key === SAVED_KEY);
    if (row) {
      const box = row.getBoundingClientRect();
      if (box.top < 60 || box.bottom > window.innerHeight) {
        row.scrollIntoView({block: 'center'});
      }
      row.classList.add('just-saved');
    }
  } else if (FINISHED !== null) {
    const n = parseInt(FINISHED, 10) || 0;
    showToast(n ? `Review finished: ${n} confirmed` : 'Review finished: nothing confirmed.');
  }
  // A refresh shouldn't announce the same save again.
  if (location.search) history.replaceState(null, '', location.pathname);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('only-missing').addEventListener('change', render);
document.querySelectorAll('.th-sort').forEach(btn => btn.addEventListener('click', () => {
  sortBy = {
    col: btn.dataset.col,
    dir: sortBy.col === btn.dataset.col ? -sortBy.dir : 1,
  };
  try { localStorage.setItem(SORT_STORE, JSON.stringify(sortBy)); } catch (e) {}
  paintSort();
  render();
}));

document.getElementById('sync-btn').addEventListener('click', async () => {
  statusEl.textContent = 'Syncing songlist…';
  const r = await fetch('{{ url_for("api_sync") }}', {method: 'POST'});
  const d = await r.json();
  statusEl.textContent = d.ok
    ? `Synced ${d.total} songs (${d.added} new).`
    : `Sync failed: ${d.error}`;
  if (!d.ok) return;
  loadRows();
  // The sync starts a propose run over the songs it just added — show it.
  if (d.proposing) {
    document.getElementById('stop-btn').hidden = false;
    document.getElementById('progress').hidden = false;
    pollProgress();
  }
});

let pollTimer = null;
document.getElementById('propose-btn').addEventListener('click', async () => {
  await fetch('{{ url_for("api_propose_start") }}', {method: 'POST'});
  document.getElementById('stop-btn').hidden = false;
  document.getElementById('progress').hidden = false;
  pollProgress();
});
document.getElementById('stop-btn').addEventListener('click', async () => {
  await fetch('{{ url_for("api_propose_stop") }}', {method: 'POST'});
  statusEl.textContent = 'Stopping after current song…';
});

async function pollProgress() {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  const r = await fetch('{{ url_for("api_propose_status") }}');
  const s = await r.json();
  const pct = s.total ? Math.round(100 * s.done / s.total) : 0;
  document.getElementById('bar').style.width = pct + '%';
  statusEl.textContent = s.running
    ? `Proposing ${s.done}/${s.total} (${s.found} found) — ${s.current}`
    : (s.total ? `Done: ${s.done}/${s.total} proposed, ${s.found} with art.` : 'Idle.');
  if (s.running) { pollTimer = setTimeout(pollProgress, 1000); }
  else {
    document.getElementById('stop-btn').hidden = true;
    loadRows();
  }
}

(async () => {
  paintSort();
  const view = RETURNING ? takeSavedView() : null;
  if (view) {
    document.getElementById('search').value = view.q || '';
    document.getElementById('only-missing').checked = !!view.onlyMissing;
  }
  await loadRows();
  announceArrival(view);
})();
</script>
{% endblock %}

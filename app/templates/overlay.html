<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Queue overlay</title>
<style>
  /* Transparent page for OBS browser source. Styling is applied per-render
     from the options in queue.json, so dashboard changes go live without
     touching OBS. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 8px;
  }
  #queue { display: flex; flex-direction: column; }
  /* Horizontal strip. Deliberately nowrap: the strip's height then never
     changes, which is what a source anchored to an edge of the scene needs.
     Overshooting the source width clips, so the settings panel does the
     arithmetic and warns rather than the layout silently reflowing. */
  body.dir-row #queue { flex-direction: row; flex-wrap: nowrap; }
  /* Artwork only: rows shrink to the cover. A flexbox stretches its children
     across the cross axis by default, which is why hiding every text field
     used to leave a small cover marooned in a full-width empty card. */
  body.art-only #queue { align-items: flex-start; }
  .row {
    display: flex;
    align-items: center;
    gap: 0.6em;
    border-radius: 10px;
    padding: 0.35em 0.6em;
    transition: opacity var(--dur, .4s) ease, transform var(--dur, .4s) ease;
  }
  /* Enter/exit states. Which pair applies is driven by the animation mode
     class on <body> (a-slide / a-fade); a-none uses no transitions at all. */
  /* A row enters ALONG the stacking axis (arriving at the end of the list)
     and leaves ACROSS it (stepping out of the line). Both flip round with the
     direction, so a horizontal strip reads the same way a column does. */
  body.a-none .row { transition: none; }
  .row.pre-enter { opacity: 0; }
  body.a-slide .row.pre-enter { transform: translateY(1.2em); }
  body.a-slide.dir-row .row.pre-enter { transform: translateX(1.2em); }
  .row.exiting { opacity: 0; }
  body.a-slide .row.exiting { transform: translateX(-2.5em); }
  body.a-slide.dir-row .row.exiting { transform: translateY(-2.5em); }

  .pos {
    font-weight: 700;
    min-width: 1.4em;
    text-align: center;
    flex: none;
  }
  .art {
    object-fit: cover;
    border-radius: 6px;
    flex: none;
    background: rgba(0,0,0,.4);
  }
  .meta { min-width: 0; }
  .title, .artist, .requester {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title { font-weight: 600; }
  .artist { opacity: .85; font-size: .85em; }
  .requester { opacity: .7; font-size: .75em; font-style: italic; }

  /* Empty-queue promo. Its text is a sentence, not a song title, so it wraps
     instead of ellipsizing — capped so it breaks at a sane width rather than
     running the full width of the browser source. */
  .row.promo .title, .row.promo .artist { white-space: normal; overflow: visible; }
  .row.promo .meta { max-width: 18em; }

  /* Presets */
  body.p-dark .row { background: rgba(12,12,16,.82); color: #f2f2f2;
                     box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  body.p-light .row { background: rgba(250,250,252,.88); color: #16161a;
                      box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  body.p-minimal .row { background: none; color: #fff; padding: 0.15em 0;
                        text-shadow: 0 1px 4px rgba(0,0,0,.9),
                                     0 0 12px rgba(0,0,0,.6); }
  body.p-glass .row { background: rgba(255,255,255,.10); color: #fff;
                      backdrop-filter: blur(10px);
                      -webkit-backdrop-filter: blur(10px);
                      border: 1px solid rgba(255,255,255,.18);
                      text-shadow: 0 1px 3px rgba(0,0,0,.6); }

  /* Card off: strip the preset's chrome so the artwork floats on the
     transparent source. It follows every preset rather than being a fifth
     one, so "no box, but dark-preset text" is still reachable. The promo is
     exempt — it only ever shows when nothing else does, so it never sits
     beside a bare cover, and its message has to stay readable. */
  body.no-card .row:not(.promo) {
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
</style>
</head>
<body class="p-{{ opts.preset }} a-{{ opts.animation }}">
<div id="queue"></div>
<script>
  const QS = {{ qs | tojson }};
  const POLL_MS = 5000;
  const queueEl = document.getElementById("queue");

  // key -> row element currently in the DOM, in display order.
  const rows = new Map();
  let lastItems = "";
  let lastOpts = "";
  let animating = false;
  let pendingData = null;

  const esc = s => (s || "").replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // Queue item id is the stable identity; fall back to song+slot for the
  // unlikely case the API omits it.
  const keyOf = it => it.id != null
    ? "id:" + it.id
    : `${it.title}|${it.artist}|${it.position}`;

  function durations(o) {
    if (o.animation === "none") return { exit: 0, move: 0, enter: 0, stagger: 0 };
    const f = o.anim_speed === "fast" ? 0.5 : 1;
    return { exit: 400 * f, move: 400 * f, enter: 300 * f, stagger: 60 * f };
  }

  // The promo card borrows the row chrome but none of the song fields: no
  // position number, and its two lines are not the per-field toggles' to hide.
  function promoHtml(item, o) {
    let h = "";
    if (o.show_artwork)
      h += `<img class="art" src="${esc(item.art)}" width="${o.art_size}" height="${o.art_size}" alt="">`;
    let meta = `<div class="title" style="color:${esc(o.accent)}">${esc(item.title)}</div>`;
    if (item.artist) meta += `<div class="artist">${esc(item.artist)}</div>`;
    return h + `<div class="meta">${meta}</div>`;
  }

  function rowHtml(item, o) {
    if (item.promo) return promoHtml(item, o);
    let h = "";
    if (o.show_position)
      h += `<div class="pos" style="color:${esc(o.accent)}">${item.position}</div>`;
    if (o.show_artwork)
      h += `<img class="art" src="${esc(item.art)}" width="${o.art_size}" height="${o.art_size}" alt="">`;
    let meta = "";
    if (o.show_title) meta += `<div class="title">${esc(item.title)}</div>`;
    if (o.show_artist && item.artist) meta += `<div class="artist">${esc(item.artist)}</div>`;
    if (o.show_requester && item.requester)
      meta += `<div class="requester">requested by ${esc(item.requester)}</div>`;
    if (meta) h += `<div class="meta">${meta}</div>`;
    return h;
  }

  function applyPageStyle(o, d) {
    // The server has already forced the text fields off in row direction and
    // dropped the position number when nothing else is showing, so this only
    // has to reflect what it was sent.
    const artOnly = !o.show_title && !o.show_artist && !o.show_requester;
    const dir = o.direction === "row" ? "row" : "column";
    document.body.className = `p-${o.preset} a-${o.animation} dir-${dir}`
      + (artOnly ? " art-only" : "")
      + (o.show_card === false ? " no-card" : "");
    document.body.style.fontSize = o.font_size + "px";
    document.body.style.setProperty("--dur", (d.move / 1000) + "s");
    queueEl.style.gap = o.row_gap + "px";
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reflow = el => void el.offsetHeight;

  async function transition(items, o) {
    const d = durations(o);
    applyPageStyle(o, d);

    const newKeys = new Set(items.map(keyOf));
    const exiting = [...rows.entries()].filter(([k]) => !newKeys.has(k));
    const entering = items.filter(it => !rows.has(keyOf(it)));

    // 1. Exit: fade / slide out the departed rows, then drop them.
    if (exiting.length) {
      if (d.exit) {
        exiting.forEach(([, el]) => el.classList.add("exiting"));
        await wait(d.exit);
      }
      exiting.forEach(([k, el]) => { el.remove(); rows.delete(k); });
    }

    // 2. Move (FLIP): record where the surviving rows are, reorder/refresh the
    // DOM instantly, transform each row back to its old spot, then release.
    const survivors = items.filter(it => rows.has(keyOf(it)));
    const firstRects = new Map(
      survivors.map(it => [keyOf(it), rows.get(keyOf(it)).getBoundingClientRect()])
    );
    survivors.forEach(it => {
      const el = rows.get(keyOf(it));
      el.innerHTML = rowHtml(it, o);   // position number etc. may have changed
      queueEl.appendChild(el);         // re-append in new order
    });
    let moved = false;
    if (d.move) {
      // Both axes, so one code path covers a column shifting up and a strip
      // shifting sideways.
      survivors.forEach(it => {
        const el = rows.get(keyOf(it));
        const first = firstRects.get(keyOf(it));
        const now = el.getBoundingClientRect();
        const dx = first.left - now.left;
        const dy = first.top - now.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          moved = true;
          el.style.transition = "none";
          el.style.transform = `translate(${dx}px, ${dy}px)`;
        }
      });
      if (moved) {
        reflow(queueEl);
        survivors.forEach(it => {
          const el = rows.get(keyOf(it));
          el.style.transition = "";
          el.style.transform = "";
        });
        await wait(d.move);
      }
    }

    // 3. Enter: new rows appear at their slots (usually the bottom), staggered.
    // DOM order must match item order, so rebuild the sequence with the new
    // rows included.
    if (entering.length) {
      items.forEach(it => {
        const k = keyOf(it);
        let el = rows.get(k);
        if (!el) {
          el = document.createElement("div");
          el.className = "row pre-enter" + (it.promo ? " promo" : "");
          el.innerHTML = rowHtml(it, o);
          rows.set(k, el);
        }
        queueEl.appendChild(el);
      });
      reflow(queueEl);
      let i = 0;
      for (const it of entering) {
        const el = rows.get(keyOf(it));
        setTimeout(() => el.classList.remove("pre-enter"), d.stagger * i++ + 30);
      }
      await wait(d.enter + d.stagger * entering.length);
    }
  }

  async function render(data) {
    const itemsJson = JSON.stringify(data.items);
    const optsJson = JSON.stringify(data.options);
    if (itemsJson === lastItems && optsJson === lastOpts) return;
    const itemsChanged = itemsJson !== lastItems;
    lastItems = itemsJson;
    lastOpts = optsJson;

    animating = true;
    try {
      if (itemsChanged) {
        await transition(data.items, data.options);
      } else {
        // Style-only change (dashboard settings save): restyle in place.
        const o = data.options;
        applyPageStyle(o, durations(o));
        data.items.forEach(it => {
          const el = rows.get(keyOf(it));
          if (el) el.innerHTML = rowHtml(it, o);
        });
      }
    } finally {
      animating = false;
    }
    if (pendingData) {
      const next = pendingData;
      pendingData = null;
      render(next);
    }
  }

  async function poll() {
    try {
      const resp = await fetch("/overlay/queue.json" + (QS ? "?" + QS : ""));
      if (resp.ok) {
        const data = await resp.json();
        if (animating) pendingData = data;   // finish the current sequence first
        else render(data);
      }
    } catch (e) { /* dashboard briefly down — keep last render */ }
    setTimeout(poll, POLL_MS);
  }
  poll();
</script>
</body>
</html>

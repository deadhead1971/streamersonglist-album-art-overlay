<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now playing overlay</title>
<style>
  /* Transparent page for OBS browser source. Styling is applied per-render
     from the options in current.json, so dashboard changes go live without
     touching OBS. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 8px;
  }
  /* max-width keeps the card inside the OBS browser source: without it a long
     title runs off the right edge — the text is cut mid-word and the right
     corners never render, which reads as "the corners aren't rounded". */
  #stage { display: inline-block; max-width: 100%; }
  /* The art sits inset by --pad rather than bleeding to the card edge, and
     takes the concentric inner radius (outer − pad) so the two curves nest. */
  .card {
    display: flex;
    align-items: stretch;
    --radius: 14px;
    --pad: 8px;
    max-width: 100%;
    padding: var(--pad);
    border-radius: var(--radius);
    overflow: hidden;
    transition: opacity var(--dur, .4s) ease, transform var(--dur, .4s) ease;
  }
  body.l-vertical .card {
    flex-direction: column;
  }
  /* In vertical mode the art defines the card width so text ellipsizes
     instead of widening the card past the artwork. */
  body.l-vertical.has-art .card { width: calc(var(--art) + 2 * var(--pad)); }
  /* Enter/exit states, driven by the animation mode class on <body>. */
  body.a-none .card { transition: none; }
  .card.pre-enter { opacity: 0; }
  body.a-slide .card.pre-enter { transform: translateY(1.2em); }
  .card.exiting { opacity: 0; }
  body.a-slide .card.exiting { transform: translateX(-2.5em); }

  .art {
    display: block;
    object-fit: cover;
    flex: none;
    align-self: center;   /* centres the art if the text column is taller */
    background: rgba(0,0,0,.4);
  }
  /* The art carries its own radius rather than leaning on the card's
     overflow:hidden to clip it — OBS's Chromium does not apply a rounded
     overflow clip to a composited child layer (the card is composited, because
     of its transition), so a flush-mounted image renders square-cornered there
     while desktop Chrome looks right. Both values inherit from .card, so the
     inset and the two radii can never drift apart. */
  .art { border-radius: calc(var(--radius) - var(--pad)); }
  .meta {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* Left padding is the art-to-text gap; the card's --pad supplies the outer
       edges, so the right and vertical values are trimmed to suit. */
    padding: .35em .5em .35em .8em;
    line-height: 1.25;
  }
  body.l-vertical .meta { padding: .45em .25em .1em; }
  .label {
    font-size: .5em;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: .3em;
  }
  /* The label ellipsizes with the rest: wrapping it pushes the card taller
     than the art, which looks like a layout bug in a narrow browser source. */
  .label, .title, .artist, .requester {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title { font-weight: 700; }
  .artist { opacity: .85; font-size: .78em; margin-top: .1em; }
  .requester { opacity: .65; font-size: .6em; font-style: italic; margin-top: .35em; }
  .title.placeholder { opacity: .6; font-style: italic; }

  /* Empty-queue promo: a sentence rather than a song title, so it wraps
     instead of ellipsizing, capped so a wide source does not stretch it into
     one long line. */
  .card.promo .title, .card.promo .artist { white-space: normal; overflow: visible; }
  .card.promo .meta { max-width: 16em; }
  /* A song card in vertical layout is pinned to the artwork width. The promo
     sizes to its text instead — wrapped into a 160px column a sentence is
     unreadable — and the art centres itself above it. */
  body.l-vertical .card.promo { width: auto; min-width: var(--art); }

  /* Presets */
  body.p-dark .card { background: rgba(12,12,16,.82); color: #f2f2f2;
                      box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  body.p-light .card { background: rgba(250,250,252,.88); color: #16161a;
                       box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  /* Minimal has no card surface — nothing to inset against — so it drops the
     padding entirely, the art keeps its own radius and the text column drops
     the boxed padding. */
  body.p-minimal .card { background: none; color: #fff; overflow: visible;
                         padding: 0;
                         text-shadow: 0 1px 4px rgba(0,0,0,.9),
                                      0 0 12px rgba(0,0,0,.6); }
  body.p-minimal .art { border-radius: 10px; }
  body.p-minimal .meta { padding: 0 .4em 0 .8em; }
  body.p-minimal.l-vertical .meta { padding: .45em .1em 0; }
  body.p-glass .card { background: rgba(255,255,255,.10); color: #fff;
                       backdrop-filter: blur(10px);
                       -webkit-backdrop-filter: blur(10px);
                       border: 1px solid rgba(255,255,255,.18);
                       text-shadow: 0 1px 3px rgba(0,0,0,.6); }
</style>
</head>
<body class="p-{{ opts.preset }} a-{{ opts.animation }} l-{{ opts.layout }}">
<div id="stage"></div>
<script>
  let QS = {{ qs | tojson }};
  const POLL_MS = 5000;
  const stage = document.getElementById("stage");

  let cardEl = null;      // the current .card element, if shown
  let lastKey = null;     // identity of the song the card shows
  let lastItem = "";
  let lastOpts = "";
  let animating = false;
  let pendingData = null;

  const esc = s => (s || "").replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  const keyOf = it => it == null ? null
    : (it.id != null ? "id:" + it.id : `${it.title}|${it.artist}`);

  function durations(o) {
    if (o.animation === "none") return { exit: 0, enter: 0 };
    const f = o.anim_speed === "fast" ? 0.5 : 1;
    return { exit: 400 * f, enter: 400 * f };
  }

  // The promo card keeps the card chrome but not the song fields — see the
  // queue overlay for the same reasoning.
  function promoHtml(item, o) {
    let h = "";
    if (o.show_artwork)
      h += `<img class="art" src="${esc(item.art)}" width="${o.art_size}" height="${o.art_size}" alt="">`;
    let meta = `<div class="title" style="color:${esc(o.accent)}">${esc(item.title)}</div>`;
    if (item.artist) meta += `<div class="artist">${esc(item.artist)}</div>`;
    return h + `<div class="meta">${meta}</div>`;
  }

  function cardHtml(item, o) {
    if (item && item.promo) return promoHtml(item, o);
    let h = "";
    if (o.show_artwork) {
      const src = item ? item.art : "/overlay/fallback.png";
      h += `<img class="art" src="${esc(src)}" width="${o.art_size}" height="${o.art_size}" alt="">`;
    }
    let meta = "";
    if (o.show_label)
      meta += `<div class="label" style="color:${esc(o.accent)}">${esc(o.label_text)}</div>`;
    if (item) {
      if (o.show_title) meta += `<div class="title">${esc(item.title)}</div>`;
      if (o.show_artist && item.artist) meta += `<div class="artist">${esc(item.artist)}</div>`;
      if (o.show_requester && item.requester)
        meta += `<div class="requester">requested by ${esc(item.requester)}</div>`;
    } else {
      meta += `<div class="title placeholder">Nothing playing</div>`;
    }
    if (meta) h += `<div class="meta">${meta}</div>`;
    return h;
  }

  function applyPageStyle(o, d) {
    document.body.className = `p-${o.preset} a-${o.animation} l-${o.layout}`
      + (o.show_artwork ? " has-art" : "");
    document.body.style.fontSize = o.font_size + "px";
    document.body.style.setProperty("--art", o.art_size + "px");
    document.body.style.setProperty("--dur", (Math.max(d.exit, d.enter) / 1000) + "s");
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reflow = el => void el.offsetHeight;

  async function removeCard(d) {
    if (!cardEl) return;
    if (d.exit) {
      cardEl.classList.add("exiting");
      await wait(d.exit);
    }
    cardEl.remove();
    cardEl = null;
  }

  async function showCard(item, o, d) {
    const el = document.createElement("div");
    el.className = "card pre-enter" + (item && item.promo ? " promo" : "");
    el.innerHTML = cardHtml(item, o);
    stage.appendChild(el);
    cardEl = el;
    reflow(el);
    el.classList.remove("pre-enter");
    if (d.enter) await wait(d.enter);
  }

  async function transition(item, o) {
    const d = durations(o);
    applyPageStyle(o, d);
    const showPlaceholder = item == null && !o.hide_when_empty;
    await removeCard(d);
    if (item != null || showPlaceholder) await showCard(item, o, d);
  }

  async function render(data) {
    const itemJson = JSON.stringify(data.item);
    const optsJson = JSON.stringify(data.options);
    if (itemJson === lastItem && optsJson === lastOpts) return;
    const key = keyOf(data.item);
    const songChanged = key !== lastKey;
    lastItem = itemJson;
    lastOpts = optsJson;
    lastKey = key;

    animating = true;
    try {
      const o = data.options;
      if (songChanged || (data.item == null && !!cardEl === o.hide_when_empty)) {
        await transition(data.item, o);
      } else {
        // Style-only change (or artwork URL refresh): restyle in place.
        applyPageStyle(o, durations(o));
        if (cardEl) cardEl.innerHTML = cardHtml(data.item, o);
      }
    } finally {
      animating = false;
    }
    if (pendingData) {
      const next = pendingData;
      pendingData = null;
      render(next);
    }
  }

  // One timer, always — see the note in overlay.html: the settings preview
  // polls on demand as well as on the clock.
  let pollTimer = null;

  async function poll() {
    try {
      const resp = await fetch("/overlay/current.json" + (QS ? "?" + QS : ""));
      if (resp.ok) {
        const data = await resp.json();
        if (animating) pendingData = data;   // finish the current sequence first
        else render(data);
      }
    } catch (e) { /* dashboard briefly down — keep last render */ }
    clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, POLL_MS);
  }
  poll();

  // Live preview: a new query string from the settings page, applied without a
  // reload. Never fires in OBS — nothing there posts to the overlay.
  window.addEventListener("message", ev => {
    if (ev.origin !== location.origin) return;
    if (!ev.data || typeof ev.data.overlayQs !== "string") return;
    QS = ev.data.overlayQs;
    poll();
  });
</script>
</body>
</html>
